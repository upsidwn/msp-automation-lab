name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install graphviz (dot binary, diagram.py shells out to it)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install dependencies
        working-directory: lab/network-inventory-collector
        run: pip install -r source/requirements.txt
      - name: Run tests
        working-directory: lab/network-inventory-collector
        run: pytest tests/

  test-config-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install dependencies
        working-directory: lab/config-backup-system
        run: pip install -r source/requirements.txt
      - name: Install Ansible collections
        working-directory: lab/config-backup-system/source
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run tests
        working-directory: lab/config-backup-system
        run: pytest tests/

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint .

  lint-ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install project dependencies
        working-directory: lab/config-backup-system
        run: pip install -r source/requirements.txt
      - name: Install ansible-lint
        run: pip install ansible-lint
      - name: Install Ansible collections
        working-directory: lab/config-backup-system/source
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run ansible-lint
        working-directory: lab/config-backup-system/source
        run: ansible-lint backup.yml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        working-directory: lab/network-inventory-collector
        run: docker build -t network-inventory-collector:ci .
      - name: Verify container runs as non-root user
        run: |
          actual_user=$(docker run --rm --entrypoint whoami network-inventory-collector:ci)
          if [ "$actual_user" != "collector" ]; then
            echo "Expected container to run as 'collector', got '$actual_user'"
            exit 1
          fi
          echo "Container correctly runs as: $actual_user"
      - name: Save image for push-collector-image
        run: docker save network-inventory-collector:ci -o /tmp/network-inventory-collector.tar
      - uses: actions/upload-artifact@v4
        with:
          name: network-inventory-collector-image
          path: /tmp/network-inventory-collector.tar

  push-collector-image:
    # Only publish once everything else in CI has actually passed -
    # a leaked secret or a failing test should never still result in
    # a published image. Reuses the exact image docker-build-collector
    # already built and verified non-root, rather than rebuilding from
    # scratch, so what's pushed is guaranteed to be what was checked.
    needs:
      - test-collector
      - test-config-backup
      - lint-python
      - lint-yaml
      - lint-ansible
      - secret-scan
      - docker-build-collector
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: network-inventory-collector-image
          path: /tmp
      - name: Load the verified image
        run: docker load -i /tmp/network-inventory-collector.tar
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Tag and push image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          image="ghcr.io/${owner}/network-inventory-collector"
          docker tag network-inventory-collector:ci "${image}:latest"
          docker tag network-inventory-collector:ci "${image}:sha-${short_sha}"
          docker push "${image}:latest"
          docker push "${image}:sha-${short_sha}"
