---
# Diffs the current EXOS running config against the known-good
# baseline set_baseline.yml wrote, using the real `diff -u` tool
# rather than reinventing text diffing - the standard way this kind
# of drift check works in practice. Read-only against the device, and
# never fails the play just because drift exists (drift is the normal
# thing this playbook exists to find, not an error) - it only fails
# loud if no baseline has ever been set for this host.
#
#   ansible-playbook check_drift.yml --limit exos --ask-vault-pass
- name: Check EXOS running config for drift against the known-good baseline
  hosts: exos
  gather_facts: false

  tasks:
    - name: Make sure the output directory exists (git doesn't track empty folders)
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../output"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Check whether a baseline has been set for this host
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../known_good/{{ inventory_hostname }}_config.golden"
      register: baseline_file
      delegate_to: localhost

    - name: Fail loud if there's no baseline yet
      ansible.builtin.fail:
        msg: >-
          No baseline set for {{ inventory_hostname }} yet - run
          set_baseline.yml first (-e confirm_baseline_update=true)
          before this can check for drift.
      when: not baseline_file.stat.exists

    - name: Pull the current running config
      ansible.netcommon.cli_command:
        command: show config
      register: current_config

    - name: Write the current config to a temp file for diffing
      ansible.builtin.tempfile:
        state: file
        suffix: .current
      register: current_config_file
      delegate_to: localhost

    - name: Save the current config into the temp file
      ansible.builtin.copy:
        content: "{{ current_config.stdout }}"
        dest: "{{ current_config_file.path }}"
        mode: "0644"
      delegate_to: localhost

    - name: Diff the current config against the baseline
      # diff's own exit codes: 0 = identical, 1 = differences found
      # (the expected/normal "drift found" case, not a task failure),
      # 2+ = a real error (e.g. a file genuinely missing or unreadable)
      ansible.builtin.command:
        cmd: "diff -u {{ playbook_dir }}/../known_good/{{ inventory_hostname }}_config.golden {{ current_config_file.path }}"
      register: drift_result
      delegate_to: localhost
      changed_when: false
      failed_when: drift_result.rc not in [0, 1]

    - name: Clean up the temp file
      ansible.builtin.file:
        path: "{{ current_config_file.path }}"
        state: absent
      delegate_to: localhost

    - name: Save the drift report
      ansible.builtin.copy:
        content: >-
          {{ drift_result.stdout if drift_result.rc == 1
          else 'No drift detected - running config matches the baseline.' }}
        dest: "{{ playbook_dir }}/../output/{{ inventory_hostname }}_drift.{{ '%Y-%m-%d@%H:%M:%S' | strftime }}"
        mode: "0644"
      delegate_to: localhost

    - name: Report the result
      ansible.builtin.debug:
        msg: >-
          {{ 'DRIFT DETECTED for ' + inventory_hostname + ' - see the diff above and output/'
          if drift_result.rc == 1 else inventory_hostname + ': no drift, matches baseline' }}
